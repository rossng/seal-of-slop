name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC). No NPM_TOKEN needed.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # that ships with Node.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # Opens (or updates) a pull request that bumps the version and writes the
      # changelog. It does not publish: the trusted publisher is allowed to
      # stage a release, and not to release it, so the last step is done by a
      # human with a second factor.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm run version
          title: "Release"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the release on npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "seal-of-slop@$version" version >/dev/null 2>&1; then
            echo "seal-of-slop@$version is already published. Nothing to stage."
            exit 0
          fi
          pnpm run build
          # Staged, not published. Run `npm stage list seal-of-slop` to see it,
          # then `npm stage approve seal-of-slop@$version` to release it.
          npm stage publish
          git tag "v$version"
          git push origin "v$version"
