name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC). No NPM_TOKEN needed.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # that ships with Node. changeset publish shells out to npm, not pnpm,
      # because pnpm cannot do OIDC publishing yet.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "Release"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
